name: Protected secret scan

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# pull_request_target deliberately loads this workflow and its allowlist from the
# base branch. The job fetches PR commits only as Git objects; it never checks out,
# imports, builds, or executes content from the untrusted head.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Base-controlled Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Fetch untrusted PR history as Git objects
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid pull-request identity supplied by the event payload.\n' >&2
            exit 1
          fi

          fetched_ref="refs/remotes/pull/${PR_NUMBER}/head"
          auth_header="$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --force --no-tags --no-recurse-submodules \
            origin "+refs/pull/${PR_NUMBER}/head:${fetched_ref}"
          unset auth_header GH_READ_TOKEN

          fetched_head="$(git rev-parse "${fetched_ref}^{commit}")"
          if [[ "$fetched_head" != "$PR_HEAD_SHA" ]]; then
            printf 'Fetched PR head mismatch: expected %s, got %s\n' \
              "$PR_HEAD_SHA" "$fetched_head" >&2
            exit 1
          fi

      - name: Scan exact untrusted change history
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$(uname -m)" != 'x86_64' ]]; then
            printf 'Unexpected runner architecture.\n' >&2
            exit 1
          fi

          version='8.24.3'
          archive_name="gitleaks_${version}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive_name"
          binary_dir="$RUNNER_TEMP/gitleaks-$version"
          expected_sha256='9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
          approved_ignore_sha256='c3730150f9d81d6712b86dab11679c0619fa49540f2947a144cf8f523d104886'

          if [[ ! -f .gitleaksignore || -L .gitleaksignore ]]; then
            printf 'Trusted Gitleaks allowlist is missing or is not a regular file.\n' >&2
            exit 1
          fi
          actual_ignore_sha256="$(sha256sum .gitleaksignore | awk '{print $1}')"
          if [[ "$actual_ignore_sha256" != "$approved_ignore_sha256" ]]; then
            printf 'trusted gitleaks allowlist checksum mismatch: expected %s, got %s\n' \
              "$approved_ignore_sha256" "$actual_ignore_sha256" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive_name}"

          printf '%s  %s\n' "$expected_sha256" "$archive_path" | sha256sum --check --strict

          mkdir -p "$binary_dir"
          tar -xzf "$archive_path" -C "$binary_dir" gitleaks

          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Invalid pull-request identity supplied by the event payload.\n' >&2
              exit 1
            fi
            scan_from="$PR_BASE_SHA"
            scan_to="$PR_HEAD_SHA"
            if [[ "$(git rev-parse HEAD)" != "$scan_from" ]]; then
              printf 'Trusted checkout does not match the event base SHA.\n' >&2
              exit 1
            fi
            fetched_ref="refs/remotes/pull/${PR_NUMBER}/head"
            fetched_head="$(git rev-parse "${fetched_ref}^{commit}")"
            if [[ "$fetched_head" != "$scan_to" ]]; then
              printf 'fetched PR head mismatch: expected %s, got %s\n' \
                "$scan_to" "$fetched_head" >&2
              exit 1
            fi

            if ! git diff --quiet --no-ext-diff --no-textconv \
              "$scan_from" "$scan_to" -- \
              .gitleaksignore .github/workflows/protected-secret-scan.yml; then
              printf 'PRs may not modify the base-controlled secret-scan policy.\n' >&2
              exit 1
            fi
          else
            if [[ ! "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PUSH_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Invalid push identity supplied by the event payload.\n' >&2
              exit 1
            fi
            scan_from="$PUSH_BEFORE_SHA"
            scan_to="$PUSH_HEAD_SHA"
            if [[ "$(git rev-parse HEAD)" != "$scan_to" ]]; then
              printf 'Trusted checkout does not match the pushed SHA.\n' >&2
              exit 1
            fi
          fi

          git cat-file -e "${scan_to}^{commit}"
          if [[ -z "$scan_from" || "$scan_from" =~ ^0+$ ]]; then
            log_opts="$scan_to"
          else
            git cat-file -e "${scan_from}^{commit}"
            log_opts="${scan_from}..${scan_to}"
          fi

          expected_commit_count="$(git rev-list --count "$log_opts")"
          if [[ "$expected_commit_count" -eq 0 ]]; then
            printf 'Refusing an empty gitleaks range: %s\n' "$log_opts" >&2
            exit 1
          fi

          printf 'Scanning %s commits from exact git range: %s\n' \
            "$expected_commit_count" "$log_opts"
          gitleaks_log_opts="--no-ext-diff --no-textconv --no-renames --diff-merges=first-parent --no-abbrev-commit $log_opts"
          "$binary_dir/gitleaks" git \
            --redact \
            --verbose \
            --exit-code 2 \
            --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore" \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks-results.sarif" \
            --log-opts "$gitleaks_log_opts" \
            "$GITHUB_WORKSPACE"
