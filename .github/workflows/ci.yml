name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / PowerShell ${{ matrix.pwsh-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        pwsh-version: ['7.4.19', '7.6.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Each row installs its exact PowerShell version rather than trusting the
      # runner image, then asserts the running version matches before doing work.
      # Pinned release tags + direct GitHub release assets: no third-party action,
      # no secrets, fork-safe.
      - name: Install PowerShell ${{ matrix.pwsh-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.pwsh-version }}'
          $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq [System.Runtime.InteropServices.Architecture]::Arm64) { 'arm64' } else { 'x64' }

          if ($IsWindows) {
              $asset = "PowerShell-$version-win-$arch.zip"
          } elseif ($IsLinux) {
              $asset = "powershell-$version-linux-$arch.tar.gz"
          } elseif ($IsMacOS) {
              $asset = "powershell-$version-osx-$arch.tar.gz"
          } else {
              throw 'Unsupported runner OS.'
          }

          $installDir = Join-Path $env:RUNNER_TOOL_CACHE "pwsh-$version"
          $archive = Join-Path $env:RUNNER_TEMP $asset

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Write-Host "Downloading $asset"
          Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$version/$asset" -OutFile $archive

          if ($IsWindows) {
              Expand-Archive -Path $archive -DestinationPath $installDir -Force
          } else {
              tar -xzf $archive -C $installDir
          }

          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          Write-Host "Installed PowerShell $version to $installDir"

      - name: Assert PowerShell version
        shell: pwsh
        run: |
          $expected = '${{ matrix.pwsh-version }}'
          $actual = $PSVersionTable.PSVersion
          $expectedMajorMinor = (($expected -split '\.')[0..1] -join '.')
          $actualMajorMinor = "$($actual.Major).$($actual.Minor)"
          if ($actualMajorMinor -ne $expectedMajorMinor) {
              throw "PowerShell version mismatch: expected $expectedMajorMinor.x, got $actual"
          }
          Write-Host "PowerShell version asserted: $actual"

      - name: Resolve build dependencies
        shell: pwsh
        run: pwsh -File ./build.ps1 -ResolveDependency -Tasks noop

      - name: Build
        shell: pwsh
        run: pwsh -File ./build.ps1 -Tasks build

      - name: Test
        shell: pwsh
        run: pwsh -File ./build.ps1 -Tasks test

      - name: Gate on whole Pester result
        shell: pwsh
        run: |
          $resultFiles = @(Get-ChildItem -Path 'output/testResults/NUnitXml_*.xml' -ErrorAction SilentlyContinue)
          if ($resultFiles.Count -eq 0) {
              throw 'No NUnit result file produced at output/testResults/NUnitXml_*.xml'
          }
          if ($resultFiles.Count -gt 1) {
              throw "Multiple NUnit result files produced: $($resultFiles.Name -join ', ')"
          }
          # Task 1.2 added the snapshot store: 4 fixed-count QA tests (module control +
          # changelog) plus 25 Snapshot.Tests.ps1 tests for the six Private/Snapshot
          # functions (the original 14, plus 11 added fixing a post-review Critical/
          # Important/load-bearing-Minor pass: ordinal key sorting, DateTimeOffset/NaN
          # handling, atomic+locked manifest writes, and dataset-name path-traversal
          # validation) = 29. Task 1.3 added the operator key + pseudonymization layer,
          # then hardened it after review (exclusive first-create via FileMode.CreateNew
          # to fix a check-then-act race, pre-write chmod ordering, 0700 on the created
          # key directory, strict 32-byte re-read validation, and documentation-only
          # fixes for the Windows permission story and the snapshot-root guard's
          # fail-open contract): 14 Identity.Tests.ps1 tests (9 for Get-PulseOperatorKey
          # covering auto-create, reuse, 0600 file / 0700 directory permissions,
          # concurrent-create convergence, the never-inside-a-snapshot-root guard on
          # both the create and read paths at direct and nested depth, and the
          # corrupt-key-file error; 5 for Get-PulsePseudonym covering a pinned
          # known-answer vector, format, stability, and divergence across keys/values)
          # = 43. Task 1.4 added the check descriptor schema + loader
          # (Import-PulseCheckCatalog, Test-PulseCheckDescriptor), then hardened it
          # after a two-reviewer pass found coercion holes (array-typed Id/Severity
          # silently passing pattern/enum checks via PowerShell's loose typing,
          # duplicate-Id detection bypassable the same way, no filename on aggregated
          # error lines, the dataset map re-parsed per descriptor with unhandled
          # malformed-map errors and no exclusion of a DatasetMap.psd1 living inside
          # the catalog dir, and a culture-aware Sort-Object instead of ordinal):
          # 32 CheckCatalog.Tests.ps1 tests covering valid-catalog loading with
          # ordinal Id-sorted output independent of on-disk filename order, an
          # empty/missing catalog directory returning zero descriptors without
          # throwing (including the module's own still-empty default
          # source/Data/Checks path), aggregated (not fail-fast) errors - each line
          # prefixed with its source filename - naming the offending Id/filename and
          # property for duplicate Id, bad Severity/Effort/Impact, missing
          # References.Research, empty Data.Datasets/References.Authorities, unknown
          # Rule.Type, a Rule.Function that does not resolve at import time, a
          # malformed Id, a missing Consulting field, and a missing Rule.Expression;
          # explicit type-mismatch coverage for array-typed Id (both the
          # pattern-escaping case and the would-have-bypassed-duplicate-detection
          # case), array-typed Severity, a numeric Title, a scalar Data.Datasets, a
          # scalar References.Authorities, and a descriptor parse failure aggregated
          # alongside other problems in the same catalog; the
          # Data.Datasets-vs-shared-dataset-map cross-check (skipped with
          # Write-Verbose until Task 1.5 lands DatasetMap.psd1, enforced via a
          # temp-file-backed -DatasetMapPath once present, a malformed map file
          # surfaced through the aggregated-errors path instead of a raw error, a
          # DatasetMap.psd1 living inside the catalog dir excluded from descriptor
          # scanning, and the map file proven to be parsed exactly once per catalog
          # load via a shadowed-cmdlet call-count check); plus direct
          # Test-PulseCheckDescriptor unit coverage with an exact-error-count pin (not
          # just >1) and exact "must be a <type>, got <actual type>" text assertions
          # for every H1-listed coercion hole = 75. Task 1.5 added the collector - the
          # module's only Graph-touching layer, and its first PUBLIC function,
          # Get-PulseTenantSnapshot (source/Public). It added
          # Get-PulseCollectionManifest (dedup/union datasets across checks through the
          # new shared source/Data/DatasetMap.psd1, ordinal-sorted, unknown-dataset
          # throws naming the check id), Assert-PulseReadOnlyDescriptor (the
          # ThrottleClass='Read' -and ReplayPolicy='Safe' predicate, shared verbatim
          # with Task 1.10's future static gate), Get-PulseFailureClass (attempt-and-
          # classify 403-vs-everything-else, isolated so it is unit-testable against a
          # synthetic ErrorRecord without any live GraphKit shape), and
          # Invoke-PulseCollection (the per-dataset attempt/write loop, including the
          # Pending-flagged-dataset short-circuit for the two datasets - mdmAuthority,
          # entraDevices - whose GraphKit descriptors do not exist yet). All four
          # GraphKit commands TenantPulse calls (Get-GraphContext, Get-GraphObject,
          # Invoke-GraphOperation, Get-GraphOperation) are stubbed directly inside the
          # TenantPulse module scope in BeforeAll with a default throwing mock
          # registered first. GraphKit 0.1.0 is a real, importable RequiredModules
          # dependency of TenantPulse itself (published to PSGallery) and IS present in
          # the test environment - it is the module-scope stub shadowing every call
          # TenantPulse's own code makes, not GraphKit's absence, that keeps these tests
          # deterministic and independent of a live tenant:
          # 18 Get-PulseTenantSnapshot.Tests.ps1 tests covering manifest
          # dedup/union/unknown-dataset/ordinal-sort/Pending-passthrough (6),
          # Assert-PulseReadOnlyDescriptor throwing for Write/NeverReplay and passing
          # for Read+Safe (3), Get-PulseFailureClass classifying a structured
          # StatusCode 403/500 and a message-text-only 403 fallback (4),
          # Invoke-PulseCollection collecting/skipping-with-permission-reason/failing
          # three datasets independently plus the Pending short-circuit making zero
          # Get-GraphObject calls (2), and the public Get-PulseTenantSnapshot
          # end-to-end wiring: tenant field is always the pseudonym never the raw
          # profile id, a total context-acquisition failure still writes the snapshot
          # with every dataset Failed and collectionFailure set, and -IncludeCategory
          # narrows the collected dataset set (3). Plus the "Quality for module" and
          # "Help for module" Describe blocks now actually running against the first
          # exported function (8 more, via module.tests.ps1's -ForEach) = 99. Task 1.5's
          # two-reviewer fix round then closed six gaps: Get-PulseFailureClass is now
          # TOTAL (a nested TryParse-based status-code conversion, never a bare [int]
          # cast that throws on a string StatusCode like "403 Forbidden", and the whole
          # body wrapped so a $null ErrorRecord or a garbage-typed status value can never
          # itself throw out of the collector's catch), gained an AuthFailure
          # classification (401 / AADSTS-code / "token acquisition" / "unauthorized"
          # shapes); a new Protect-PulseReason redacts -ProfileId (and, once resolved,
          # the raw tenant id) out of every reason string before it reaches the manifest,
          # capped at 500 chars, routed through unconditionally in both
          # Get-PulseTenantSnapshot and Invoke-PulseCollection; Invoke-PulseCollection
          # now handles the lazy-auth case GraphKit's zero-network-call Get-GraphContext
          # implies - an AuthFailure at the FIRST dataset attempt sets collectionFailure,
          # fails every remaining dataset with reason 'auth-failure: collection aborted'
          # and makes no further Graph calls, then returns (the store is still written);
          # Assert-PulseReadOnlyDescriptor gained an -ApiVersion drift check, downgraded
          # to a per-dataset Failed outcome (never run-aborting, unlike the read-only
          # predicate violation which stays fatal); every GraphKit-facing call
          # (Get-GraphContext, Get-GraphObject, Get-GraphOperation) now passes
          # -ErrorAction Stop so a non-terminating error can never record a silently
          # empty Collected dataset; and -ProfileId/-Path both gained
          # [ValidateNotNullOrEmpty()]. 18 new tests (99 -> 117): AuthFailure/never-throws
          # classification coverage for Get-PulseFailureClass (7), Protect-PulseReason
          # redaction/cap/empty-message coverage (4), Assert-PulseReadOnlyDescriptor
          # ApiVersion-match/drift coverage (2), Invoke-PulseCollection's version-drift
          # downgrade, lazy-auth abort, and reason-redaction coverage (3), and
          # Get-PulseTenantSnapshot's lazy-auth-at-first-dataset and empty-ProfileId/
          # -Path validation coverage (2). This minimum must keep ratcheting up as
          # check/function test suites are added in later tasks - see docs/superpowers/sdd
          # for the phase plan.
          #
          # -AllowNotRun 0: the "Quality for module" (2 It) and "Help for module" (4
          # It) Describe blocks now have exactly one function (Get-PulseTenantSnapshot)
          # to drive their -ForEach - FunctionsToExport is no longer empty now that
          # Task 1.5 landed the module's first Public function. Every NotRun block from
          # Task 1.4's placeholder allowance is gone; any NotRun block reappearing here
          # means test-case generation silently broke again and must be investigated,
          # not re-allowed.
          #
          # Task 1.6 added the evaluator (source/Private/Evaluate/): New-PulseFinding
          # (the rule-result contract every Function rule returns), Get-PulseGateStatus
          # (the Phase 1 gate stub - always 'Unknown', never degrades a check) and
          # Invoke-PulseEvaluation itself (the engine that turns a snapshot + check
          # catalog into the findings document and its in-memory redaction map). 22 new
          # tests (117 -> 139): New-PulseFinding evidence normalization/validation (4),
          # Get-PulseGateStatus's Unknown-for-any-gate stub contract (1), and 17
          # Invoke-PulseEvaluation tests covering Expression/Function rule Pass/Fail/
          # Warn/Error paths, Function-rule-throws-then-run-continues, NotApplicable
          # degrade for missing/Failed/Skipped datasets (reason quoted verbatim from the
          # manifest), gate-declared-but-Unknown-does-not-degrade, ordinal findings/
          # evidence sort, generatedUtc pinned to the manifest's createdUtc (not wall
          # clock), the RedactionMap covering every evidence identity, no raw
          # pseudonyms/PSTypeName leaking into the serialized findings JSON, and
          # byte-identical double serialization through ConvertTo-PulseCanonicalJson.
          # This minimum must keep ratcheting up as check/function test suites are added
          # in later tasks - see docs/superpowers/sdd for the phase plan.
          pwsh -File ./tests/QA/Assert-GateResult.ps1 -ResultPath $resultFiles[0].FullName -MinimumTests 139 -AllowedSkips 0 -AllowNotRun 0
