  secret-scan:
    name: Secret/PII scan (gitleaks)
    runs-on: ubuntu-latest
    # Complements tests/QA/SecretScan.tests.ps1 (which runs offline, in every `test` job
    # above, on every developer machine) with gitleaks' much larger, actively-maintained
    # rule set. Public-repo gitleaks-action needs no license key/secret - just the
    # already-available GITHUB_TOKEN - so this stays fork-safe like the rest of this
    # workflow.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
